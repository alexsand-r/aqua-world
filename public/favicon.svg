<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Акваріумний бірюзовий градієнт -->
    <linearGradient id="aquaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    
    <!-- Градієнт для букв AW -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Закруглений бірюзовий квадрат -->
  <rect width="100" height="100" rx="22" fill="url(#aquaGradient)" />

  <!-- Бульбашки акваріума на тлі -->
  <circle cx="20" cy="25" r="4" fill="#ffffff" opacity="0.25" />
  <circle cx="82" cy="30" r="3" fill="#ffffff" opacity="0.2" />
  <circle cx="78" cy="70" r="5" fill="#ffffff" opacity="0.18" />

  <!-- Ініціали AW -->
  <text 
    x="50%" 
    y="56%" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="40" 
    fill="url(#textGradient)" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="-1.5"
  >
    AW
  </text>

  <!-- Декоративна подвійна хвиля під буквами -->
  <path d="M 22 74 Q 36 68, 50 74 T 78 74" stroke="#67e8f9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
</svg>
